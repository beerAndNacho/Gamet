name: Apply Direct Play Review

on:
  push:
    branches: [main]
    paths:
      - '.vaultbound-review.ready'

permissions:
  contents: write

concurrency:
  group: vaultbound-direct-review
  cancel-in-progress: false

jobs:
  apply-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decode reviewed build patch
        run: |
          cat .vaultbound-review.part-* | base64 --decode > /tmp/vaultbound-review-payload.tgz
          echo '29e4b26d666eabda1218fd590f5a28f19bd26acde89fc4c7bac959481cfb3558  /tmp/vaultbound-review-payload.tgz' | sha256sum --check
          mkdir -p /tmp/vaultbound-review-patch
          tar -xzf /tmp/vaultbound-review-payload.tgz -C /tmp/vaultbound-review-patch
      - name: Apply direct-play fixes
        run: bash /tmp/vaultbound-review-patch/apply.sh .
      - name: Validate full game
        run: |
          npm run check
          npm test
          npm run simulate
      - name: Commit reviewed release
        run: |
          rm -f .vaultbound-review.part-* .vaultbound-review.ready
          rm -f .github/workflows/apply-direct-review.yml
          rm -f .github/workflows/export-review-source.yml
          git config user.name 'Vaultbound Review Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'fix: rebalance vaults and add distinct guided mission layouts'
          git push origin HEAD:main
