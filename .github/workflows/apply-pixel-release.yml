name: Apply Pixel Release

on:
  push:
    branches: [main]
    paths:
      - '.vaultbound-release.ready'

permissions:
  contents: write

concurrency:
  group: vaultbound-pixel-release
  cancel-in-progress: false

jobs:
  apply-release:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decode validated release
        run: |
          cat \
            .vaultbound-release.part-00 \
            .vaultbound-release.part-01 \
            .vaultbound-release.part-02 \
            .vaultbound-release.part-03 \
            .vaultbound-release.part-04 \
            .vaultbound-release.part-05 \
            .vaultbound-release.part-06 \
            .vaultbound-release.part-07x-* \
            .vaultbound-release.part-08 \
            .vaultbound-release.part-09 \
            .vaultbound-release.part-10 \
            | base64 --decode > /tmp/vaultbound-release.tgz
          echo '5880151d6931e313f7f8dea1ce79e29ef761c6c1c3bb7032293008c17a9675ce  /tmp/vaultbound-release.tgz' | sha256sum --check
          tar -tzf /tmp/vaultbound-release.tgz >/dev/null
      - name: Replace game contents
        run: |
          find . -mindepth 1 -maxdepth 1 \
            ! -name .git \
            ! -name .github \
            ! -name '.vaultbound-release.part-*' \
            ! -name .vaultbound-release.ready \
            -exec rm -rf {} +
          tar --exclude='.github' -xzf /tmp/vaultbound-release.tgz -C .
          rm -f .vaultbound-release.part-* .vaultbound-release.ready
      - name: Validate extracted game
        run: |
          npm run check
          npm test
          npm run simulate
      - name: Commit pixel game release
        run: |
          git config user.name "Vaultbound Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat: rebuild Vaultbound as a pixel stealth adventure"
          git push origin HEAD:main
