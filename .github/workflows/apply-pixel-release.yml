name: Apply Pixel Release

on:
  push:
    branches: [main]
    paths:
      - '.vaultbound-release.tgz.b64'

permissions:
  contents: write

concurrency:
  group: vaultbound-pixel-release
  cancel-in-progress: false

jobs:
  apply-release:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decode validated release
        run: |
          base64 --decode .vaultbound-release.tgz.b64 > /tmp/vaultbound-release.tgz
          tar -tzf /tmp/vaultbound-release.tgz >/dev/null
      - name: Replace repository contents
        run: |
          find . -mindepth 1 -maxdepth 1 \
            ! -name .git \
            ! -name .github \
            ! -name .vaultbound-release.tgz.b64 \
            -exec rm -rf {} +
          find .github -mindepth 1 -maxdepth 1 ! -name workflows -exec rm -rf {} +
          find .github/workflows -type f ! -name apply-pixel-release.yml -delete
          tar -xzf /tmp/vaultbound-release.tgz -C .
          rm -f .vaultbound-release.tgz.b64
          rm -f .github/workflows/apply-pixel-release.yml
      - name: Validate extracted game
        run: |
          npm run check
          npm test
          npm run simulate
      - name: Commit pixel game release
        run: |
          git config user.name "Vaultbound Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat: rebuild Vaultbound as a pixel stealth adventure"
          git push origin HEAD:main
