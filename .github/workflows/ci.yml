name: Pixel Game CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate-test-simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate project
        run: npm run check
      - name: Run state and content tests
        run: npm test
      - name: Run deterministic balance simulation
        run: npm run simulate
